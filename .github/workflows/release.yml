name: Build Standalone Executables and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: VideoToASCII-Windows.exe
          - os: macos-latest
            artifact_name: VideoToASCII-macOS
          - os: ubuntu-latest
            artifact_name: VideoToASCII-Linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
          pip install -r requirements.txt pyinstaller

      - name: Install dependencies (macOS & Windows)
        if: runner.os != 'Linux'
        run: pip install -r requirements.txt pyinstaller

      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean --onefile --icon=icon.ico --name=VideoToASCII-Windows app.py
          mkdir dist-release
          copy dist\VideoToASCII-Windows.exe dist-release\
        shell: cmd

      - name: Build macOS Binary
        if: runner.os == 'macOS'
        run: |
          pyinstaller --clean --onefile --name=VideoToASCII-macOS app.py
          chmod +x dist/VideoToASCII-macOS
          mkdir -p dist-release
          cp dist/VideoToASCII-macOS dist-release/

      - name: Build Linux Binary
        if: runner.os == 'Linux'
        run: |
          pyinstaller --clean --onefile --name=VideoToASCII-Linux app.py
          chmod +x dist/VideoToASCII-Linux
          mkdir -p dist-release
          cp dist/VideoToASCII-Linux dist-release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-release/*

  publish-release:
    name: Publish Release with All Binaries
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all compiled binaries
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: List Artifacts
        run: ls -lh release-binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Video to ASCII Player ${{ github.ref_name }} (Standalone Binaries)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎬 Video to ASCII Player - Bản phát hành chạy độc lập (Standalone Executables)

            🚀 **Không cần cài đặt Python! Bấm phát chạy luôn!**

            ---

            ### 📦 Tải về phiên bản cho máy của bạn:

            - **🪟 Windows:** Tải file **`VideoToASCII-Windows.exe`**
              - *Cách dùng:* Nhấp đúp chuột để mở bảng điều khiển chọn video và chế độ, hoặc kéo thả trực tiếp file video vào file `.exe` để phát ngay lập tức!
            
            - **🍎 macOS (Macbook / iMac):** Tải file **`VideoToASCII-macOS`**
              - *Cách dùng:* Mở Terminal tại thư mục tải về, chạy `chmod +x VideoToASCII-macOS` rồi chạy `./VideoToASCII-macOS`.
            
            - **🐧 Linux (Ubuntu, Debian, Fedora, Arch,...):** Tải file **`VideoToASCII-Linux`**
              - *Cách dùng:* Mở Terminal tại thư mục tải về, chạy `chmod +x VideoToASCII-Linux` rồi chạy `./VideoToASCII-Linux`.

            ---

            ### ✨ Các tính năng nổi bật:
            - 🎨 **Màu sắc TrueColor (RGB):** Tái tạo màu sắc chân thực từng điểm ảnh bằng mã ANSI.
            - 🟢 **Phong cách Hacker Matrix:** Tông màu xanh neon Cyberpunk siêu ngầu.
            - 📺 **Đen trắng cổ điển:** Đồ họa ký tự ASCII hoài cổ (Monochrome).
            - 🔊 **Đồng bộ âm thanh:** Tự động phát âm thanh nền qua FFmpeg (`ffplay`).
            - 🖥️ **Bảng điều khiển GUI & Kéo thả nhanh:** Dễ dùng cho tất cả mọi người, không cần nhớ câu lệnh!
          files: |
            release-binaries/*
